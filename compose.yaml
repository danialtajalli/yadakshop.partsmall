name: partsmall

x-logging: &logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

x-application: &application
  image: partsmall-app:production
  env_file: ${DOCKER_ENV_FILE:-.env.docker}
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_URL: ""
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    CACHE_STORE: ${CACHE_STORE:-redis}
    REDIS_CLIENT: phpredis
    REDIS_URL: ""
    REDIS_HOST: redis-queue
    REDIS_PORT: 6379
    REDIS_DB: 0
    REDIS_PASSWORD: ""
    REDIS_USERNAME: ""
    REDIS_CACHE_HOST: redis-cache
    REDIS_CACHE_PORT: 6379
    REDIS_CACHE_DB: 0
    REDIS_CACHE_URL: ""
    REDIS_CACHE_PASSWORD: ""
    REDIS_QUEUE_HOST: redis-queue
    REDIS_QUEUE_PORT: 6379
    REDIS_QUEUE_DB: 0
    REDIS_QUEUE_URL: ""
    REDIS_QUEUE_PASSWORD: ""
    REDIS_QUEUE_USERNAME: ""
    REDIS_QUEUE_CONNECTION: queue
    REDIS_CACHE_CONNECTION: cache
    REDIS_CACHE_LOCK_CONNECTION: queue
    REDIS_QUEUE_RETRY_AFTER: 180
    REDIS_QUEUE_BLOCK_FOR: 5
    SESSION_DRIVER: database
    SCOUT_DRIVER: collection
    LOG_CHANNEL: stderr
    DB_QUEUE_RETRY_AFTER: 180
  volumes:
    - storage:/var/www/html/storage
    - uploads:/var/www/html/storage/app/public
    - uploads:/var/www/html/public/panel/assets/uploads
  depends_on:
    mysql:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    redis-queue:
      condition: service_healthy
  init: true
  restart: unless-stopped
  logging: *logging

services:
  app:
    <<: *application
    build:
      context: .
      target: production
    healthcheck:
      test: ["CMD", "php", "docker/healthcheck.php"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: partsmall-web:production
    build:
      context: .
      target: web
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:80"
    volumes:
      - uploads:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  queue:
    <<: *application
    depends_on:
      app:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    stop_signal: SIGTERM
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "php", "docker/worker-healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  setup:
    <<: *application
    profiles: ["tools"]
    command: ["sh", "docker/setup.sh"]
    restart: "no"

  import-uploads:
    image: partsmall-app:production
    profiles: ["tools"]
    entrypoint: ["sh", "/usr/local/bin/import-uploads"]
    volumes:
      - type: bind
        source: ${UPLOAD_SOURCE:-./storage/app/public}
        target: /source-uploads
        read_only: true
        bind:
          create_host_path: false
      - uploads:/target-uploads
      - ./docker/import-uploads.sh:/usr/local/bin/import-uploads:ro
    restart: "no"
    logging: *logging

  redis-cache:
    image: redis:${REDIS_VERSION:-7.4.11-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data:size=16m,mode=1777
    mem_limit: ${REDIS_CACHE_CONTAINER_MEMORY:-512m}
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli ping)" = PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  redis-queue:
    image: redis:${REDIS_VERSION:-7.4.11-alpine}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_QUEUE_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-queue:/data
    mem_limit: ${REDIS_QUEUE_CONTAINER_MEMORY:-768m}
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli ping)" = PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-partsmall}
      MYSQL_USER: ${DB_USERNAME:-partsmall}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected Docker environment file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the selected Docker environment file}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging

volumes:
  mysql:
  storage:
  uploads:
  redis-queue:
