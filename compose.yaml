name: partsmall

x-application: &application
  image: partsmall-app:production
  env_file: ${DOCKER_ENV_FILE:-.env.docker}
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_URL: ""
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
    SCOUT_DRIVER: collection
    LOG_CHANNEL: stderr
    DB_QUEUE_RETRY_AFTER: 180
  volumes:
    - storage:/var/www/html/storage
    - uploads:/var/www/html/storage/app/public
    - uploads:/var/www/html/public/panel/assets/uploads
  depends_on:
    mysql:
      condition: service_healthy
  init: true
  restart: unless-stopped

services:
  app:
    <<: *application
    build:
      context: .
      target: production
    healthcheck:
      test: ["CMD", "php", "docker/healthcheck.php"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: partsmall-web:production
    build:
      context: .
      target: web
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:80"
    volumes:
      - uploads:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  queue:
    <<: *application
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    stop_signal: SIGTERM
    stop_grace_period: 150s

  setup:
    <<: *application
    profiles: ["tools"]
    command: ["sh", "docker/setup.sh"]
    restart: "no"

  import-uploads:
    image: partsmall-app:production
    profiles: ["tools"]
    entrypoint: ["sh", "/usr/local/bin/import-uploads"]
    volumes:
      - type: bind
        source: ${UPLOAD_SOURCE:-./storage/app/public}
        target: /source-uploads
        read_only: true
        bind:
          create_host_path: false
      - uploads:/target-uploads
      - ./docker/import-uploads.sh:/usr/local/bin/import-uploads:ro
    restart: "no"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-partsmall}
      MYSQL_USER: ${DB_USERNAME:-partsmall}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run php docker/init-env.php first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run php docker/init-env.php first}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql:
  storage:
  uploads:
